openapi: 3.0.3
info:
  title: Formance Simple Wallets Service API
  version: 0.1.0
servers:
  - url: http://localhost:8080/
paths:
  x-speakeasy-errors:
    statusCodes:
      - default
  /_info:
    get:
      summary: Get server info
      operationId: getServerInfo
      tags:
        - wallets.v1
      responses:
        '200':
          description: Server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
  /transactions:
    get:
      operationId: getTransactions
      parameters:
        - name: pageSize
          in: query
          description: The maximum number of results to return per page
          example: 100
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 15
        - name: walletID
          in: query
          description: A wallet ID to filter on
          example: wallet1
          schema:
            type: string
        - name: cursor
          in: query
          description: |
            Parameter used in pagination requests.
            Set to the value of next for the next page of results.
            Set to the value of previous for the previous page of results.
            No other parameters can be set when the cursor is set.
          schema:
            type: string
            example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
      tags:
        - wallets.v1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
  /wallets:
    get:
      summary: List all wallets
      operationId: listWallets
      parameters:
        - name: name
          in: query
          description: Filter on wallet name
          example: wallet1
          schema:
            type: string
        - name: metadata
          in: query
          description: >-
            Filter wallets by metadata key value pairs. Nested objects can be
            used as seen in the example below.
          style: deepObject
          explode: true
          schema:
            type: object
            properties: {}
            additionalProperties:
              type: string
          example:
            admin: 'true'
        - name: pageSize
          in: query
          description: The maximum number of results to return per page
          example: 100
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 15
        - name: cursor
          in: query
          description: |
            Parameter used in pagination requests.
            Set to the value of next for the next page of results.
            Set to the value of previous for the previous page of results.
            No other parameters can be set when the pagination token is set.
          schema:
            type: string
            example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
        - name: expand
          in: query
          example: balances
          schema:
            type: string
            items:
              type: string
      tags:
        - wallets.v1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWalletsResponse'
        default:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
    post:
      summary: Create a new wallet
      operationId: createWallet
      tags:
        - wallets.v1
      parameters:
        - name: Idempotency-Key
          in: header
          description: Use an idempotency key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWalletResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:write
  /wallets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a wallet
      operationId: getWallet
      tags:
        - wallets.v1
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWalletResponse'
        '404':
          description: Wallet not found
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
    patch:
      summary: Update a wallet
      operationId: updateWallet
      tags:
        - wallets.v1
      parameters:
        - name: Idempotency-Key
          in: header
          description: Use an idempotency key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - metadata
              properties:
                metadata:
                  type: object
                  description: Custom metadata to attach to this wallet.
                  additionalProperties:
                    type: string
      responses:
        '204':
          description: Wallet successfully updated
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:write
  /wallets/{id}/summary:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get wallet summary
      operationId: getWalletSummary
      tags:
        - wallets.v1
      responses:
        '200':
          description: Wallet summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWalletSummaryResponse'
        '404':
          description: Wallet not found
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
  /wallets/{id}/balances:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List balances of a wallet
      operationId: listBalances
      tags:
        - wallets.v1
      responses:
        '200':
          description: Balances list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBalancesResponse'
      security:
        - Authorization:
            - wallets:read
    post:
      summary: Create a balance
      operationId: createBalance
      tags:
        - wallets.v1
      parameters:
        - name: Idempotency-Key
          in: header
          description: Use an idempotency key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBalanceRequest'
      responses:
        '201':
          description: Created balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBalanceResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:write
  /wallets/{id}/balances/{balanceName}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: balanceName
          in: path
          required: true
          schema:
            type: string
      summary: Get detailed balance
      operationId: getBalance
      tags:
        - wallets.v1
      responses:
        '200':
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBalanceResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
  /wallets/{id}/debit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Use an idempotency key
        schema:
          type: string
    post:
      summary: Debit a wallet
      operationId: debitWallet
      parameters:
        - name: Idempotency-Key
          in: header
          description: Use an idempotency key
          schema:
            type: string
      tags:
        - wallets.v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitWalletRequest'
      responses:
        '201':
          description: Wallet successfully debited as a pending hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitWalletResponse'
        '204':
          description: Wallet successfully debited
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:write
  /wallets/{id}/credit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Use an idempotency key
        schema:
          type: string
    post:
      summary: Credit a wallet
      operationId: creditWallet
      parameters:
        - name: Idempotency-Key
          in: header
          description: Use an idempotency key
          schema:
            type: string
      tags:
        - wallets.v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditWalletRequest'
      responses:
        '204':
          description: Wallet successfully credited
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:write
  /holds:
    get:
      summary: Get all holds for a wallet
      tags:
        - wallets.v1
      operationId: getHolds
      parameters:
        - name: pageSize
          in: query
          description: The maximum number of results to return per page
          example: 100
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 15
        - name: walletID
          in: query
          description: The wallet to filter on
          example: wallet1
          schema:
            type: string
        - name: metadata
          in: query
          description: >-
            Filter holds by metadata key value pairs. Nested objects can be used
            as seen in the example below.
          style: deepObject
          schema:
            type: object
            properties: {}
            additionalProperties:
              type: string
          example:
            admin: 'true'
        - name: cursor
          in: query
          description: |
            Parameter used in pagination requests.
            Set to the value of next for the next page of results.
            Set to the value of previous for the previous page of results.
            No other parameters can be set when the pagination token is set.
          schema:
            type: string
            example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
      responses:
        '200':
          description: Holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHoldsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
  /holds/{holdID}:
    get:
      summary: Get a hold
      tags:
        - wallets.v1
      operationId: getHold
      parameters:
        - name: holdID
          in: path
          schema:
            type: string
          required: true
          description: The hold ID
      responses:
        '200':
          description: Holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHoldResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:read
  /holds/{hold_id}/confirm:
    post:
      parameters:
        - name: hold_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Use an idempotency key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmHoldRequest'
      summary: Confirm a hold
      tags:
        - wallets.v1
      operationId: confirmHold
      responses:
        '204':
          description: Hold successfully confirmed, funds moved back to initial destination
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:write
  /holds/{hold_id}/void:
    parameters:
      - name: hold_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Use an idempotency key
        schema:
          type: string
    post:
      summary: Cancel a hold
      operationId: voidHold
      tags:
        - wallets.v1
      parameters:
        - name: Idempotency-Key
          in: header
          description: Use an idempotency key
          schema:
            type: string
      responses:
        '204':
          description: Hold successfully cancelled, funds returned to wallet
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Authorization:
            - wallets:write
components:
  securitySchemes:
    Authorization:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '/oauth/token'
          refreshUrl: '/oauth/token'
          scopes: {}
  schemas:
    Monetary:
      type: object
      description: An amount together with the asset it is denominated in
      required:
        - asset
        - amount
      properties:
        asset:
          type: string
          description: The asset of the monetary value.
        amount:
          type: integer
          format: bigint
          description: The amount of the monetary value.
    Wallet:
      type: object
      description: A wallet backed by a set of ledger accounts
      required:
        - name
        - id
        - metadata
        - createdAt
        - ledger
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of the wallet.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata associated with the wallet.
        name:
          type: string
          description: Human-readable name of the wallet
        createdAt:
          type: string
          format: date-time
          description: When the wallet was created
        ledger:
          type: string
          description: Name of the ledger backing this wallet
        balances:
          type: object
          description: The wallet's main balance, keyed by asset
          required:
            - main
          properties:
            main:
              $ref: '#/components/schemas/AssetHolder'
    WalletWithBalances:
      type: object
      description: A wallet together with the funds it currently holds
      required:
        - name
        - id
        - metadata
        - createdAt
        - balances
        - ledger
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of the wallet.
        metadata:
          type: object
          description: Metadata associated with the wallet.
          additionalProperties:
            type: string
        name:
          type: string
          description: Human-readable name of the wallet
        createdAt:
          type: string
          format: date-time
          description: When the wallet was created
        balances:
          type: object
          description: Aggregated funds held by the wallet, keyed by asset
          required:
            - main
          properties:
            main:
              $ref: '#/components/schemas/AssetHolder'
        ledger:
          type: string
          description: Name of the ledger backing this wallet
    Hold:
      type: object
      description: Funds locked by a pending debit, later either confirmed or voided
      required:
        - id
        - walletID
        - metadata
        - description
        - asset
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of the hold.
        walletID:
          type: string
          description: The ID of the wallet the hold is associated with.
        metadata:
          type: object
          description: Metadata associated with the hold.
          additionalProperties:
            type: string
        asset:
          type: string
          description: Asset the held funds are denominated in
        description:
          type: string
          description: Human-readable reason the funds were held
        destination:
          $ref: '#/components/schemas/Subject'
    ExpandedDebitHold:
      description: A hold together with the amounts it currently locks and has already released
      allOf:
        - $ref: '#/components/schemas/Hold'
        - type: object
          required:
            - remaining
            - originalAmount
          properties:
            remaining:
              type: integer
              description: Remaining amount on hold
              example: 10
              format: bigint
            originalAmount:
              type: integer
              description: Original amount on hold
              example: 100
              format: bigint
    ListWalletsResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of wallets
          allOf:
            - $ref: '#/components/schemas/Cursor'
            - properties:
                data:
                  items:
                    $ref: '#/components/schemas/Wallet'
                  type: array
              type: object
              required:
                - data
    CreateWalletResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Wallet'
    GetWalletResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/WalletWithBalances'
    GetWalletSummaryResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/WalletSummary'
    DebitWalletResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Hold'
    AggregatedVolumes:
      type: object
      description: Volumes aggregated per account and per asset
      x-go-type:
        type: AggregatedVolumes
      additionalProperties:
        $ref: '#/components/schemas/Volumes'
    Posting:
      type: object
      properties:
        amount:
          type: integer
          format: bigint
          minimum: 0
          description: Amount to move, as an arbitrary-precision integer expressed in the asset's smallest unit
          example: 100
        asset:
          type: string
          description: The asset being moved, optionally carrying a scale suffix such as USD/2
          example: COIN
        destination:
          type: string
          description: Address of the account credited by this posting
          example: users:002
        source:
          type: string
          description: Address of the account debited by this posting
          example: users:001
      required:
        - amount
        - asset
        - destination
        - source
    Transaction:
      type: object
      properties:
        ledger:
          type: string
          description: Name of the ledger the transaction was recorded in
        timestamp:
          type: string
          format: date-time
          description: >-
            The transaction time: when the transaction is considered to have occurred. See [bi-
            temporality](https://docs.formance.com/modules/ledger/working-with/bi-temporality)
        postings:
          type: array
          description: The fund movements making up the transaction
          items:
            $ref: '#/components/schemas/Posting'
        reference:
          type: string
          description: Optional caller-supplied identifier, unique within the ledger, used to deduplicate transactions
          example: ref:001
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata associated with the wallet.
        id:
          type: integer
          format: int64
          minimum: 0
          description: Unique sequential identifier for this transaction within the ledger
        preCommitVolumes:
          $ref: '#/components/schemas/AggregatedVolumes'
        postCommitVolumes:
          $ref: '#/components/schemas/AggregatedVolumes'
      required:
        - postings
        - timestamp
        - id
        - metadata
    Cursor:
      type: object
      required:
        - pageSize
      properties:
        pageSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          description: Number of items requested per page
          example: 15
        hasMore:
          type: boolean
          description: Whether further pages are available
          example: false
        previous:
          type: string
          description: Cursor for the previous page, absent on the first page
          example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
        next:
          type: string
          description: Cursor for the next page, absent on the last page
          example: ''
    GetTransactionsResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of transactions
          allOf:
            - $ref: '#/components/schemas/Cursor'
            - properties:
                data:
                  items:
                    $ref: '#/components/schemas/Transaction'
                  type: array
              type: object
              required:
                - data
    GetHoldsResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of holds
          allOf:
            - $ref: '#/components/schemas/Cursor'
            - properties:
                data:
                  items:
                    $ref: '#/components/schemas/Hold'
                  type: array
              type: object
              required:
                - data
    GetHoldResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ExpandedDebitHold'
    CreateWalletRequest:
      type: object
      required:
        - name
        - metadata
      properties:
        metadata:
          type: object
          description: Custom metadata to attach to this wallet.
          additionalProperties:
            type: string
        name:
          type: string
          description: Human-readable name for the wallet
    Volume:
      type: object
      properties:
        input:
          type: integer
          format: bigint
          description: Total amount credited for this asset
        output:
          type: integer
          format: bigint
          description: Total amount debited for this asset
        balance:
          type: integer
          format: bigint
          description: Net balance, equal to input minus output
      required:
        - input
        - output
        - balance
      example:
        input: 100
        output: 20
        balance: 80
    Volumes:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Volume'
      example:
        USD:
          input: 100
          output: 10
          balance: 90
        EUR:
          input: 100
          output: 10
          balance: 90
    ConfirmHoldRequest:
      type: object
      properties:
        amount:
          type: integer
          format: bigint
          example: 100
          description: Define the amount to transfer.
        final:
          type: boolean
          example: true
          description: >-
            Define a final confirmation. Remaining funds will be returned to the
            wallet.
    LedgerAccountSubject:
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          type: string
          description: Discriminator identifying this subject as a ledger account
        identifier:
          type: string
          description: Address of the ledger account
    WalletSubject:
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          type: string
          description: Discriminator identifying this subject as a wallet
        identifier:
          type: string
          description: Identifier of the wallet
        balance:
          type: string
          description: Name of the balance within the wallet to use. Defaults to the main balance when omitted
    Subject:
      description: The counterparty of a wallet movement, either a ledger account or another wallet
      discriminator:
        propertyName: type
        mapping:
          ACCOUNT: '#/components/schemas/LedgerAccountSubject'
          WALLET: '#/components/schemas/WalletSubject'
      oneOf:
        - $ref: '#/components/schemas/LedgerAccountSubject'
        - $ref: '#/components/schemas/WalletSubject'
    CreditWalletRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          $ref: '#/components/schemas/Monetary'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Metadata associated with the wallet.
        reference:
          type: string
          description: Optional caller-supplied identifier used to deduplicate the credit
        sources:
          type: array
          nullable: true
          description: Where the funds come from. Defaults to the world account when omitted
          items:
            $ref: '#/components/schemas/Subject'
        balance:
          type: string
          description: The balance to credit
        timestamp:
          type: string
          format: date-time
          description: >-
            The transaction time to record, letting you backdate or postdate the credit. See [bi-
            temporality](https://docs.formance.com/modules/ledger/working-with/bi-temporality)
      example:
        amount:
          asset: USD/2
          amount: 100
        metadata:
          key: ''
        sources: []
    DebitWalletRequest:
      type: object
      required:
        - amount
        - metadata
      properties:
        amount:
          $ref: '#/components/schemas/Monetary'
        pending:
          type: boolean
          description: >-
            Set to true to create a pending hold. If false, the wallet will be
            debited immediately.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata associated with the wallet.
        description:
          type: string
          description: Human-readable reason for the debit
        destination:
          $ref: '#/components/schemas/Subject'
        balances:
          type: array
          description: Names of the balances to debit from, in order. Defaults to the main balance when omitted
          items:
            type: string
            description: A targeted balance (use '*' for all)
        timestamp:
          type: string
          format: date-time
          description: cannot be used in conjunction with `pending` property
      example:
        amount:
          asset: USD/2
          amount: 100
        metadata:
          key: ''
        pending: true
    ServerInfo:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          description: Version of the wallets service
    AssetHolder:
      type: object
      required:
        - assets
      properties:
        assets:
          type: object
          description: Amounts held, keyed by asset
          additionalProperties:
            type: integer
            format: bigint
    Balance:
      type: object
      description: A named balance within a wallet, optionally carrying an expiry date
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the balance within the wallet
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the funds in this balance expire. Expired funds stop counting towards available funds
        priority:
          type: integer
          format: bigint
          description: >-
            Ordering hint when choosing which balances to debit first. Lower values are debited first, and it
            only breaks ties between balances that carry no expiry date
    BalanceWithAssets:
      description: A named balance within a wallet together with the amounts it holds per asset
      allOf:
        - $ref: '#/components/schemas/Balance'
        - $ref: '#/components/schemas/AssetHolder'
    WalletSummary:
      type: object
      description: Aggregated funds held by a wallet, broken down by availability
      required:
        - balances
        - availableFunds
        - expiredFunds
        - expirableFunds
        - holdFunds
      properties:
        balances:
          type: array
          description: Each balance of the wallet with its per-asset amounts
          items:
            $ref: '#/components/schemas/BalanceWithAssets'
        availableFunds:
          type: object
          description: >-
            Funds available to debit, keyed by asset. Covers balances with no expiry and those not yet expired
          additionalProperties:
            type: integer
            format: bigint
        expiredFunds:
          type: object
          description: Funds held in balances whose expiry date has passed, keyed by asset
          additionalProperties:
            type: integer
            format: bigint
        expirableFunds:
          type: object
          description: Funds held in balances carrying an expiry date that has not yet passed, keyed by asset
          additionalProperties:
            type: integer
            format: bigint
        holdFunds:
          type: object
          description: Funds currently locked by pending holds, keyed by asset
          additionalProperties:
            type: integer
            format: bigint
    ListBalancesResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of balances
          allOf:
            - $ref: '#/components/schemas/Cursor'
            - properties:
                data:
                  items:
                    $ref: '#/components/schemas/Balance'
                  type: array
              type: object
              required:
                - data
    GetBalanceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/BalanceWithAssets'
    CreateBalanceRequest:
      $ref: '#/components/schemas/Balance'
    CreateBalanceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Balance'
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          description: Machine-readable error code identifying the failure
          enum:
            - VALIDATION
            - INTERNAL_ERROR
            - INSUFFICIENT_FUND
            - HOLD_CLOSED
        errorMessage:
          type: string
          description: Human-readable description of the error
